# default layouts
tag_rule=id:1,layout_name:vertical_scroller
tag_rule=id:2,layout_name:monocle
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# window rules
window_rule=app_id:sioyek,tags:0,is_tag_silent:0
window_rule=app_id:mpc.mpd,tags:1,is_tag_silent:1,focused_opacity:0
window_rule=app_id:music,tags:1,is_tag_silent:1
window_rule=app_id:zen,tags:2,is_tag_silent:1
window_rule=app_id:org.qutebrowser.qutebrowser,tags:2,is_tag_silent:1
window_rule=app_id:home.foot,tags:3,is_tag_silent:1,focused_opacity:0
window_rule=app_id:foot:3,is_tag_silent:1,focused_opacity:0
window_rule=app_id:obsidian,tags:4,is_tag_silent:1
window_rule=app_id:im.dino.Dino,tags:7,is_tag_silent:1
window_rule=app_id:org.telegram.desktop,tags:7,is_tag_silent:1
window_rule=app_id:discord,tags:8,is_tag_silent:1
window_rule=app_id:vesktop,tags:8,is_tag_silent:1
window_rule=app_id:steam,tags:9,is_tag_silent:1

window_rule=app_id:^(?!(com.mitchellh.ghostty|home.foot|mpc.mpd|foot)).*$,focused_opacity:1
window_rule=app_id:com.mitchellh.ghostty,focused_opacity:0
window_rule=app_id:foot,focused_opacity:0
window_rule=app_id:mpv,unfocused_opacity:1

window_rule=app_id:Pinentry-gtk,is_floating:1
window_rule=app_id:com.popup.app,is_floating:1
window_rule=app_id:Nsxiv,is_floating:1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_proportion_preset=1.0,0.8,0.5

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.525
default_master_count=1
smart_gaps=0

# Monocole cosmetics
monocle_tab_mode=1
deck_tab_mode=1
tab_bar_height=20
tab_bar_decorate_border_width=0
tab_bar_decorate_corner_radius=0
tab_bar_decorate_font_desc=FiraCodeNerdFont 12

# Overview Setting
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
jump_label_decorate_border_width=3
jump_label_decorate_corner_radius=0
jump_label_decorate_padding_x=12
jump_label_decorate_padding_y=12
jump_label_decorate_font_desc=FiraCodeNerdFont Bold 15

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1
view_current_to_back=0

# Cursor
cursor_theme=capitaine-cursors
cursor_size=31
cursor_hide_timeout=1

# keyboard
repeat_rate=100
repeat_delay=500
numlock_on=0
xkb_rules_layout=gb

# Trackpad
disable_trackpad=0
tap_to_click=0
tap_and_drag=0
drag_lock=0
trackpad_natural_scrolling=0
# disable_while_typing=1
# left_handed=0
# middle_button_emulation=0
swipe_min_threshold=1
# click_method=0

# mouse
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=4
gap_outer_vertical=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3

blur=0
shadows=0
border_radius=0
no_radius_when_single=0
focused_opacity=0.95
unfocused_opacity=0.95
# allow_csd=0

animations=0
